<div class="arena-hud" data-hud-root>
  <div class="ripple-layer" aria-hidden="true">
    <span class="pulse-ring pulse-ring--a"></span>
    <span class="pulse-ring pulse-ring--b"></span>
  </div>

  <div class="impact-flash" aria-hidden="true"></div>
  <div class="impact-splash" aria-hidden="true"></div>
  <div class="particle-host" aria-hidden="true"></div>

  <article class="side side--win">
    <div class="side-frame">
      <p class="side-tag">WIN</p>
      <div class="digit-cage">
        <span class="mega-digit" data-counter="victories">0</span>
        <span class="digit-ghost" aria-hidden="true">0</span>
      </div>
    </div>
  </article>

  <div class="clash-core" aria-hidden="true">
    <span class="clash-bolt"></span>
    <span class="clash-label">VS</span>
  </div>

  <article class="side side--lose">
    <div class="side-frame">
      <p class="side-tag">LOSE</p>
      <div class="digit-cage">
        <span class="mega-digit" data-counter="defeats">0</span>
        <span class="digit-ghost" aria-hidden="true">0</span>
      </div>
    </div>
  </article>

  <div class="streak-banner" aria-hidden="true"></div>
</div>
