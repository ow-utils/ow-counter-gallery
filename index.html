<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OW2 Victory Counter — Design Gallery</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background:
        radial-gradient(ellipse at top, rgba(249, 158, 26, 0.12), transparent 55%),
        radial-gradient(ellipse at bottom right, rgba(33, 143, 254, 0.12), transparent 55%),
        linear-gradient(180deg, #1c2230 0%, #141925 100%);
      background-attachment: fixed;
      color: #f0e9d6;
      min-height: 100vh;
    }

    .header {
      padding: 48px 24px 32px;
      text-align: center;
      background: linear-gradient(180deg, rgba(249, 158, 26, 0.18) 0%, rgba(33, 143, 254, 0.08) 60%, transparent 100%);
      border-bottom: 1px solid rgba(249, 158, 26, 0.25);
    }

    .header h1 {
      margin: 0 0 8px;
      font-size: clamp(24px, 4vw, 36px);
      font-weight: 700;
      letter-spacing: 0.02em;
      background: linear-gradient(135deg, #f99e1a 0%, #ffd166 35%, #44e7ff 75%, #218ffe 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .header p {
      margin: 0;
      font-size: 15px;
      color: #c9c2af;
    }

    .header a {
      color: #f9b94a;
      text-decoration: none;
    }

    .header a:hover {
      text-decoration: underline;
      color: #ffd166;
    }

    .header .github-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 16px;
      color: #c9c2af;
      text-decoration: none;
      transition: color 0.2s;
    }

    .header .github-link:hover {
      color: #f99e1a;
      text-decoration: none;
    }

    .header .github-link svg {
      width: 28px;
      height: 28px;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 24px;
      padding: 32px 24px 64px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .card {
      position: relative;
      border-radius: 16px;
      overflow: hidden;
      background: linear-gradient(180deg, #232a3a 0%, #1b212e 100%);
      border: 1px solid rgba(249, 158, 26, 0.18);
      transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 14px 44px rgba(0, 0, 0, 0.55), 0 0 24px rgba(249, 158, 26, 0.2);
      border-color: rgba(249, 158, 26, 0.5);
    }

    .card-preview {
      position: relative;
      width: 100%;
      background: #0e1320;
      overflow: hidden;
    }

    .card-preview iframe {
      width: 640px;
      height: 400px;
      border: none;
      pointer-events: none;
      transform-origin: top left;
    }

    .card-preview .no-screenshot {
      display: grid;
      place-items: center;
      width: 100%;
      height: 100%;
      font-size: 14px;
      color: #6a7080;
    }

    .card-body {
      padding: 16px 20px 20px;
    }

    .card-name {
      margin: 0 0 6px;
      font-size: 18px;
      font-weight: 700;
      color: #fff5e0;
    }

    .card-desc {
      margin: 0 0 12px;
      font-size: 13px;
      color: #b8b1a0;
      line-height: 1.5;
    }

    .card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 12px;
    }

    .tag {
      padding: 2px 10px;
      border-radius: 99px;
      font-size: 11px;
      font-weight: 600;
      background: rgba(249, 158, 26, 0.16);
      color: #ffc265;
      letter-spacing: 0.03em;
      border: 1px solid rgba(249, 158, 26, 0.3);
    }

    .card-meta {
      display: flex;
      gap: 16px;
      font-size: 12px;
      color: #8a8472;
    }

    .card-actions {
      display: flex;
      gap: 8px;
      margin-top: 14px;
    }

    .btn {
      padding: 7px 16px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      transition: opacity 0.15s, transform 0.1s, box-shadow 0.2s;
      letter-spacing: 0.02em;
    }

    .btn:hover {
      opacity: 0.92;
      transform: translateY(-1px);
    }

    .btn-preview {
      background: linear-gradient(135deg, #f99e1a 0%, #ffb84d 100%);
      color: #1a1208;
      box-shadow: 0 0 0 1px rgba(255, 200, 100, 0.4), 0 4px 14px rgba(249, 158, 26, 0.35);
    }

    .btn-preview:hover {
      box-shadow: 0 0 0 1px rgba(255, 200, 100, 0.6), 0 6px 18px rgba(249, 158, 26, 0.55);
    }

    .btn-source {
      background: rgba(33, 143, 254, 0.18);
      color: #9fcfff;
      border: 1px solid rgba(33, 143, 254, 0.35);
    }

    .btn-source:hover {
      background: rgba(33, 143, 254, 0.3);
    }

    .loading,
    .error {
      text-align: center;
      padding: 64px 24px;
      color: #8a8472;
    }

    .error {
      color: #ff8a6b;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>OW2 Victory Counter — Design Gallery</h1>
    <p>
      <a href="https://github.com/ow-utils/ow2-victory-counter">ow2-victory-counter</a>
      のカスタムカウンターデザイン集 ·
      <a href="https://github.com/ow-utils/ow-counter-gallery#使い方" target="_blank" rel="noopener noreferrer">使い方</a>
    </p>
    <a class="github-link" href="https://github.com/ow-utils/ow-counter-gallery" target="_blank" rel="noopener noreferrer" aria-label="GitHubリポジトリ">
      <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
        <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
      </svg>
    </a>
  </div>

  <div class="gallery" id="gallery">
    <div class="loading">読み込み中...</div>
  </div>

  <script>
    const gallery = document.getElementById("gallery");

    async function loadGallery() {
      try {
        const res = await fetch("designs/index.json");
        if (!res.ok) throw new Error("index.json の読み込みに失敗しました");
        const slugs = await res.json();

        const designs = await Promise.all(
          slugs.map(async (slug) => {
            const metaRes = await fetch(`designs/${slug}/metadata.json`);
            if (!metaRes.ok) return null;
            const meta = await metaRes.json();
            meta.slug = slug;
            return meta;
          })
        );

        gallery.innerHTML = "";

        const valid = designs.filter(Boolean);
        if (valid.length === 0) {
          gallery.innerHTML = '<div class="loading">デザインがまだありません</div>';
          return;
        }

        for (const design of valid) {
          gallery.appendChild(createCard(design));
        }
      } catch (e) {
        gallery.innerHTML = `<div class="error">${e.message}</div>`;
      }
    }

    function createCard(design) {
      const card = document.createElement("div");
      card.className = "card";

      const tagsHtml = (design.tags || [])
        .map((t) => `<span class="tag">${esc(t)}</span>`)
        .join("");

      const obsSize = design.obs_size
        ? `${design.obs_size.width}×${design.obs_size.height}`
        : "";

      const iframeW = (design.obs_size && design.obs_size.width) || 640;
      const iframeH = (design.obs_size && design.obs_size.height) || 400;

      card.innerHTML = `
        <div class="card-preview" data-iframe-w="${iframeW}" data-iframe-h="${iframeH}">
          <iframe src="designs/preview.html?design=${design.slug}&embed" loading="lazy" sandbox="allow-scripts allow-same-origin" width="${iframeW}" height="${iframeH}"></iframe>
        </div>
        <div class="card-body">
          <h2 class="card-name">${esc(design.name)}</h2>
          <p class="card-desc">${esc(design.description || "")}</p>
          ${tagsHtml ? `<div class="card-tags">${tagsHtml}</div>` : ""}
          <div class="card-meta">
            ${design.author ? `<span>by ${design.author_url ? `<a href="${esc(design.author_url)}" target="_blank" rel="noopener noreferrer" style="color:#9fcfff;text-decoration:none;">${esc(design.author)}</a>` : esc(design.author)}</span>` : ""}
            ${obsSize ? `<span>OBS: ${obsSize}</span>` : ""}
            ${design.created ? `<span>${esc(design.created)}</span>` : ""}
          </div>
          <div class="card-actions">
            <a class="btn btn-preview" href="designs/preview.html?design=${design.slug}" target="_blank">プレビュー</a>
            <a class="btn btn-source" href="https://github.com/ow-utils/ow-counter-gallery/tree/main/designs/${design.slug}" target="_blank">ソース</a>
          </div>
        </div>
      `;

      return card;
    }

    function esc(str) {
      const d = document.createElement("div");
      d.textContent = str;
      return d.innerHTML;
    }

    function scaleIframes() {
      document.querySelectorAll(".card-preview").forEach((container) => {
        const iframe = container.querySelector("iframe");
        if (!iframe) return;
        const iframeW = Number(container.dataset.iframeW) || 640;
        const iframeH = Number(container.dataset.iframeH) || 400;
        const scale = container.clientWidth / iframeW;
        iframe.style.transform = `scale(${scale})`;
        container.style.height = `${iframeH * scale}px`;
      });
    }

    loadGallery().then(() => {
      scaleIframes();
      window.addEventListener("resize", scaleIframes);
    });
  </script>
</body>
</html>
