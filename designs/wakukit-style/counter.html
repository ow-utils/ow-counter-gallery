<div class="wks-wrap" data-wks-root>
  <div class="wks-main">
    <div class="wks-inner">
      <div class="wks-sheen" aria-hidden="true"></div>

      <div class="wks-anime wks-anime--win" aria-hidden="true">
        <div class="wks-bg"></div>
        <div class="wks-lines">
          <span class="wks-line wks-line--l"></span>
          <span class="wks-line wks-line--r"></span>
        </div>
        <div class="wks-arrow">
          <svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
            <path d="M60 12 L108 72 H80 V108 H40 V72 H12 Z" fill="#fff" stroke="#202020" stroke-width="6" stroke-linejoin="round"/>
          </svg>
        </div>
      </div>

      <div class="wks-anime wks-anime--lose" aria-hidden="true">
        <div class="wks-bg"></div>
        <div class="wks-lines">
          <span class="wks-line wks-line--l"></span>
          <span class="wks-line wks-line--r"></span>
        </div>
        <div class="wks-arrow">
          <svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
            <path d="M60 108 L12 48 H40 V12 H80 V48 H108 Z" fill="#fff" stroke="#202020" stroke-width="6" stroke-linejoin="round"/>
          </svg>
        </div>
      </div>

      <span class="wks-number wks-number--win" data-counter="victories">0</span>
      <span class="wks-label wks-label--win">勝</span>
      <span class="wks-number wks-number--lose" data-counter="defeats">0</span>
      <span class="wks-label wks-label--lose">敗</span>
    </div>
  </div>
</div>
