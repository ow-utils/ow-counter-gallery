<div class="cp-page" data-cp-root>
  <div class="cp-halftone" aria-hidden="true"></div>
  <div class="cp-rays" aria-hidden="true"></div>

  <div class="cp-panel cp-panel--win">
    <div class="cp-bubble cp-bubble--win">WIN!</div>
    <div class="cp-num cp-num--win" data-counter="victories">0</div>
  </div>

  <div class="cp-divider" aria-hidden="true">
    <span class="cp-vs">VS</span>
  </div>

  <div class="cp-panel cp-panel--lose">
    <div class="cp-bubble cp-bubble--lose">LOSE!</div>
    <div class="cp-num cp-num--lose" data-counter="defeats">0</div>
  </div>

  <div class="cp-burst" aria-hidden="true">
    <span class="cp-burst-text"></span>
  </div>
  <div class="cp-stars" aria-hidden="true"></div>
</div>
