<div class="gb-cosmos" data-gb-root>
  <div class="gb-stars gb-stars--far" aria-hidden="true"></div>
  <div class="gb-stars gb-stars--near" aria-hidden="true"></div>
  <div class="gb-nebula" aria-hidden="true"></div>
  <div class="gb-grid">
    <div class="gb-side gb-side--win">
      <div class="gb-orbit"><span class="gb-planet"></span></div>
      <div class="gb-tag">VICTORY</div>
      <div class="gb-num" data-counter="victories">0</div>
    </div>
    <div class="gb-core">
      <div class="gb-singularity">
        <div class="gb-ring"></div>
        <div class="gb-ring gb-ring--alt"></div>
        <div class="gb-event-horizon"></div>
      </div>
    </div>
    <div class="gb-side gb-side--lose">
      <div class="gb-orbit gb-orbit--rev"><span class="gb-planet gb-planet--red"></span></div>
      <div class="gb-tag">DEFEAT</div>
      <div class="gb-num" data-counter="defeats">0</div>
    </div>
  </div>
  <div class="gb-supernova" aria-hidden="true"></div>
  <div class="gb-meteors" aria-hidden="true"></div>
</div>
