<div class="sb-stage" data-sb-root>
  <div class="sb-paper">
    <div class="sb-grain" aria-hidden="true"></div>
    <div class="sb-petals" aria-hidden="true"></div>
    <div class="sb-col sb-col--win">
      <div class="sb-stamp">勝</div>
      <div class="sb-num sb-num--win" data-counter="victories">0</div>
      <div class="sb-tag">勝利</div>
    </div>
    <div class="sb-mid">
      <span class="sb-vs">対</span>
      <span class="sb-line"></span>
    </div>
    <div class="sb-col sb-col--lose">
      <div class="sb-stamp">敗</div>
      <div class="sb-num sb-num--lose" data-counter="defeats">0</div>
      <div class="sb-tag">敗北</div>
    </div>
    <div class="sb-splash" aria-hidden="true"></div>
    <div class="sb-thunder" aria-hidden="true"></div>
  </div>
</div>
