<div class="mh-cockpit" data-mh-root>
  <div class="mh-frame" aria-hidden="true">
    <span class="mh-corner mh-corner--tl"></span>
    <span class="mh-corner mh-corner--tr"></span>
    <span class="mh-corner mh-corner--bl"></span>
    <span class="mh-corner mh-corner--br"></span>
  </div>

  <div class="mh-warn-stripes mh-warn-stripes--top" aria-hidden="true"></div>
  <div class="mh-warn-stripes mh-warn-stripes--bot" aria-hidden="true"></div>

  <div class="mh-radar" aria-hidden="true">
    <div class="mh-radar-ring"></div>
    <div class="mh-radar-ring mh-radar-ring--mid"></div>
    <div class="mh-radar-ring mh-radar-ring--inner"></div>
    <div class="mh-radar-sweep"></div>
    <div class="mh-radar-blip mh-radar-blip--a"></div>
    <div class="mh-radar-blip mh-radar-blip--b"></div>
  </div>

  <div class="mh-grid">
    <div class="mh-bay mh-bay--win">
      <div class="mh-bay-head">
        <span class="mh-dot mh-dot--on"></span>
        <span class="mh-tag">KILL</span>
      </div>
      <div class="mh-reticle">
        <span class="mh-reticle-arm mh-reticle-arm--tl"></span>
        <span class="mh-reticle-arm mh-reticle-arm--tr"></span>
        <span class="mh-reticle-arm mh-reticle-arm--bl"></span>
        <span class="mh-reticle-arm mh-reticle-arm--br"></span>
        <span class="mh-num" data-counter="victories">0</span>
      </div>
    </div>
    <div class="mh-bay mh-bay--lose">
      <div class="mh-bay-head">
        <span class="mh-dot mh-dot--off"></span>
        <span class="mh-tag">DOWN</span>
      </div>
      <div class="mh-reticle mh-reticle--red">
        <span class="mh-reticle-arm mh-reticle-arm--tl"></span>
        <span class="mh-reticle-arm mh-reticle-arm--tr"></span>
        <span class="mh-reticle-arm mh-reticle-arm--bl"></span>
        <span class="mh-reticle-arm mh-reticle-arm--br"></span>
        <span class="mh-num" data-counter="defeats">0</span>
      </div>
    </div>
  </div>

  <div class="mh-banner" aria-hidden="true">
    <span class="mh-banner-text"></span>
  </div>
  <div class="mh-strobe" aria-hidden="true"></div>
</div>
