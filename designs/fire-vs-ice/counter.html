<div class="fi-arena" data-fi-root>
  <div class="fi-side fi-side--fire">
    <div class="fi-flames" aria-hidden="true">
      <span></span><span></span><span></span><span></span><span></span><span></span>
    </div>
    <div class="fi-glow fi-glow--fire" aria-hidden="true"></div>
    <div class="fi-label">WIN</div>
    <div class="fi-num fi-num--fire" data-counter="victories">0</div>
    <div class="fi-ember-host" aria-hidden="true"></div>
  </div>
  <div class="fi-center">
    <div class="fi-clash" aria-hidden="true"></div>
    <div class="fi-vs">VS</div>
  </div>
  <div class="fi-side fi-side--ice">
    <div class="fi-crystals" aria-hidden="true">
      <span></span><span></span><span></span><span></span><span></span>
    </div>
    <div class="fi-glow fi-glow--ice" aria-hidden="true"></div>
    <div class="fi-label">LOSE</div>
    <div class="fi-num fi-num--ice" data-counter="defeats">0</div>
    <div class="fi-shard-host" aria-hidden="true"></div>
  </div>
  <div class="fi-pillar fi-pillar--fire" aria-hidden="true"></div>
  <div class="fi-pillar fi-pillar--ice" aria-hidden="true"></div>
  <div class="fi-frost-overlay" aria-hidden="true"></div>
</div>
