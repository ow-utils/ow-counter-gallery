<div class="gx-screen" data-gx-root>
  <div class="gx-noise" aria-hidden="true"></div>
  <div class="gx-scan" aria-hidden="true"></div>
  <div class="gx-grid-bg" aria-hidden="true"></div>
  <div class="gx-rain" aria-hidden="true"></div>

  <header class="gx-header">
    <span class="gx-dot"></span>
    <span class="gx-meta">SYS://ow-counter v2.1</span>
    <span class="gx-meta gx-meta--right">REC ●</span>
  </header>

  <div class="gx-row">
    <div class="gx-block gx-block--win">
      <div class="gx-tag">[ WIN ]</div>
      <div class="gx-num">
        <span class="gx-num-text" data-counter="victories" data-text="0">0</span>
      </div>
    </div>
    <div class="gx-divider" aria-hidden="true">
      <span>//</span>
    </div>
    <div class="gx-block gx-block--lose">
      <div class="gx-tag">[ LOSE ]</div>
      <div class="gx-num">
        <span class="gx-num-text" data-counter="defeats" data-text="0">0</span>
      </div>
    </div>
  </div>

  <footer class="gx-footer">
    <span class="gx-bar"></span>
    <span class="gx-blink">_</span>
  </footer>

  <div class="gx-flash" aria-hidden="true"></div>
  <div class="gx-glitch-bars" aria-hidden="true"></div>
</div>
