<div class="gbo-stage" data-gbo-root>
  <section class="gbo-scorebug" aria-label="match result counter">
    <div class="gbo-scorebug__rail" aria-hidden="true"></div>
    <div class="gbo-scorebug__row gbo-scorebug__row--win">
      <span class="gbo-scorebug__label">WIN</span>
      <span class="gbo-scorebug__value" data-counter="victories">0</span>
    </div>
    <div class="gbo-scorebug__divider" aria-hidden="true"></div>
    <div class="gbo-scorebug__row gbo-scorebug__row--lose">
      <span class="gbo-scorebug__label">LOSE</span>
      <span class="gbo-scorebug__value" data-counter="defeats">0</span>
    </div>
  </section>

  <div class="gbo-fullscreen-fx" aria-hidden="true">
    <div class="gbo-edge gbo-edge--top"></div>
    <div class="gbo-edge gbo-edge--right"></div>
    <div class="gbo-edge gbo-edge--bottom"></div>
    <div class="gbo-edge gbo-edge--left"></div>
    <div class="gbo-flare gbo-flare--a"></div>
    <div class="gbo-flare gbo-flare--b"></div>
    <div class="gbo-sweep gbo-sweep--a"></div>
    <div class="gbo-sweep gbo-sweep--b"></div>
  </div>

  <section class="gbo-result" aria-live="polite">
    <div class="gbo-result__glass">
      <div class="gbo-result__kicker">RESULT CONFIRMED</div>
      <div class="gbo-result__title" data-gbo-result-title>VICTORY +1</div>
      <div class="gbo-result__counter">
        <span class="gbo-result__label" data-gbo-result-label>WIN</span>
        <span class="gbo-result__number" data-gbo-result-value>0</span>
      </div>
      <div class="gbo-result__line" aria-hidden="true"></div>
    </div>
  </section>
</div>
